name = "simple-vtt-turn"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Set to the deployed frontend's origin, e.g. "https://<user>.github.io".
# Local dev against `npm run dev` should use "http://localhost:5173".
[vars]
ALLOWED_ORIGIN = "http://localhost:5173"

# Secrets (never commit these) — set with:
#   wrangler secret put TURN_KEY_ID
#   wrangler secret put TURN_API_TOKEN
