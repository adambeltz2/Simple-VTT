name = "simple-vtt-turn-credentials"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The Origin header a browser sends has no path, so this must be the bare
# origin (no trailing /Simple-VTT/) even though the app is served from a
# subpath. Override to "http://localhost:5173" for local `wrangler dev`.
[vars]
ALLOWED_ORIGIN = "https://adambeltz2.github.io"

# Secrets (never commit these) — set with:
#   wrangler secret put TURN_KEY_ID
#   wrangler secret put TURN_API_TOKEN
